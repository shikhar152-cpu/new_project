<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Xley Logo Reveal</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; }
  canvas { display: block; height: 100vh; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Xley logo reveal, vertical 9:16. Backlit teaser style: the logo is a black
   silhouette lit from behind by a pink-to-orange rim glow. It slowly pulls back
   from very close while the light comes up, the logo fills with a sunset
   gradient from the bottom up, then the orange dot ignites.
   Deterministic: renderFrame(t) draws the frame at time t (seconds). */
const W = 1080, H = 1920;
const DURATION = 7.5;          // seconds
const LOGO_SRC = 'xley_logo.png';
const LOGO_W = 860;            // on-screen width once settled
const RES = 2;                 // layers are built at 2x for sharp close-ups

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutQuint = x => 1 - Math.pow(1 - x, 5);
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function tint(mask, fill) { // copy of mask filled with a colour/gradient, keeping mask alpha
  const c = mk(mask.width, mask.height), g = c.getContext('2d');
  g.drawImage(mask, 0, 0); g.globalCompositeOperation = 'source-in';
  g.fillStyle = typeof fill === 'function' ? fill(g) : fill; g.fillRect(0, 0, c.width, c.height);
  return c;
}

// ---------- prebuilt layers ----------
let L = {}, grain = [];
const off = mk(W, H);   // scratch layer for the fill wipe

function build(img) {
  const lw0 = LOGO_W * RES, lh0 = Math.round(img.height * lw0 / img.width);
  const pad = 420 * RES;
  const lw = lw0 + pad * 2, lh = lh0 + pad * 2;
  L.w = lw / RES; L.h = lh / RES; L.pad = pad / RES; L.lh0 = lh0 / RES;

  // full silhouette (letters + ring + dot)
  const sil = mk(lw, lh); sil.getContext('2d').drawImage(img, pad, pad, lw0, lh0);

  // orange-dot-only mask: pixels where the logo is orange rather than white
  const dot = mk(lw, lh); const dg = dot.getContext('2d'); dg.drawImage(sil, 0, 0);
  const d = dg.getImageData(0, 0, lw, lh);
  for (let i = 0; i < d.data.length; i += 4) {
    const orange = clamp((235 - d.data[i + 2]) / (235 - 70));
    d.data[i + 3] = d.data[i + 3] * orange;
  }
  dg.putImageData(d, 0, 0);

  // light colour across the logo: magenta/violet top-left -> peach/orange bottom-right
  const light = g => {
    const gr = g.createLinearGradient(pad, pad - lh0 * 0.3, pad + lw0, pad + lh0 * 1.3);
    gr.addColorStop(0.00, '#d24bff');
    gr.addColorStop(0.30, '#ff4fb8');
    gr.addColorStop(0.62, '#ff8a6a');
    gr.addColorStop(1.00, '#ffc27a');
    return gr;
  };
  const coloured = tint(sil, light);

  // rim glow = blurred silhouette minus the silhouette itself (light only spills outward)
  const glow = (r, a) => {
    const c = mk(lw, lh), g = c.getContext('2d');
    // big blurs are done on a downscaled copy: Chrome clips very large canvas blurs
    const f = r * RES >= 30 ? 8 : 1;
    const sm = mk(Math.ceil(lw / f), Math.ceil(lh / f)), sg = sm.getContext('2d');
    sg.filter = `blur(${r * RES / f}px)`; sg.drawImage(coloured, 0, 0, sm.width, sm.height);
    g.imageSmoothingQuality = 'high'; g.globalAlpha = a; g.drawImage(sm, 0, 0, lw, lh);
    g.globalAlpha = 1; g.globalCompositeOperation = 'destination-out'; g.drawImage(sil, 0, 0);
    return c;
  };
  L.rimTight = glow(2.5, 1);
  L.rimMid = glow(12, 1);
  L.rimWide = glow(42, 0.9);
  L.rimHuge = glow(105, 0.85);

  // hot white-ish core on the very edge
  const edge = mk(lw, lh), eg = edge.getContext('2d');
  const hot = tint(sil, 'rgba(255,235,240,1)');
  eg.filter = `blur(${1.2 * RES}px)`; eg.drawImage(hot, 0, 0); eg.filter = 'none';
  eg.globalCompositeOperation = 'destination-out'; eg.drawImage(sil, 0, 0);
  L.edge = edge;

  // the black body, with a faint inner edge sheen so it reads as a solid object
  const body = mk(lw, lh), bg = body.getContext('2d');
  bg.drawImage(tint(sil, '#040207'), 0, 0);
  const sheen = mk(lw, lh), sg = sheen.getContext('2d');
  sg.drawImage(coloured, 0, 0); sg.globalCompositeOperation = 'destination-out';
  sg.filter = `blur(${6 * RES}px)`; sg.drawImage(sil, 0, 0); sg.filter = 'none';
  sg.globalCompositeOperation = 'destination-in'; sg.drawImage(sil, 0, 0);
  bg.globalAlpha = 0.35; bg.drawImage(sheen, 0, 0);
  L.body = body;

  // the fill: violet -> magenta -> pink sunset gradient with soft light streaks
  const fill = mk(lw, lh), fg = fill.getContext('2d');
  fg.drawImage(tint(sil, g => {
    const gr = g.createLinearGradient(0, pad, 0, pad + lh0);
    gr.addColorStop(0.00, '#6a3cf0'); gr.addColorStop(0.40, '#b23be0');
    gr.addColorStop(0.75, '#ef5fc0'); gr.addColorStop(1.00, '#ff9bb8');
    return gr;
  }), 0, 0);
  fg.globalCompositeOperation = 'source-atop';
  for (const [cx, w, a] of [[0.18, 0.10, 0.16], [0.47, 0.06, 0.12], [0.74, 0.14, 0.14]]) {   // diagonal light streaks
    const x0 = pad + lw0 * cx, sw = lw0 * w;
    const gr = fg.createLinearGradient(x0 - sw, pad, x0 + sw, pad + lh0 * 0.6);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, `rgba(255,230,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    fg.fillStyle = gr; fg.fillRect(0, 0, lw, lh);
  }
  const hz = fg.createLinearGradient(0, pad + lh0 * 0.55, 0, pad + lh0);   // warm glow low down
  hz.addColorStop(0, 'rgba(255,160,120,0)'); hz.addColorStop(1, 'rgba(255,170,120,0.35)');
  fg.fillStyle = hz; fg.fillRect(0, 0, lw, lh);
  drawPalms(fg, pad, lw0, lh0);   // coconut palm silhouettes inside the fill
  fg.globalCompositeOperation = 'destination-out'; fg.drawImage(dot, 0, 0);   // the dot keeps its own colour
  L.fill = fill;

  // thin inner border: silhouette minus an eroded silhouette
  const er = mk(lw, lh), erg = er.getContext('2d');
  erg.drawImage(sil, 0, 0); erg.globalCompositeOperation = 'destination-in';
  const R = 5 * RES;
  for (let k = 0; k < 16; k++) erg.drawImage(sil, Math.cos(k / 16 * 6.283) * R, Math.sin(k / 16 * 6.283) * R);
  const stroke = mk(lw, lh), stg = stroke.getContext('2d');
  stg.drawImage(tint(sil, g => {
    const gr = g.createLinearGradient(pad, pad + lh0, pad + lw0, pad);
    gr.addColorStop(0.0, '#ffb35a'); gr.addColorStop(0.35, '#ff7ac8'); gr.addColorStop(1.0, '#9a5cff');
    return gr;
  }), 0, 0);
  stg.globalCompositeOperation = 'destination-out'; stg.drawImage(er, 0, 0); stg.drawImage(dot, 0, 0);
  L.stroke = stroke;

  // the orange dot, lit
  L.dot = tint(dot, g => { const r = g.createRadialGradient(pad + lw0 * 0.07, pad + lh0 * 0.8, 0, pad + lw0 * 0.07, pad + lh0 * 0.8, lw0 * 0.05); r.addColorStop(0, '#ffb46e'); r.addColorStop(1, '#e8853a'); return r; });
  const dGlow = mk(lw, lh), dgg = dGlow.getContext('2d');
  for (const [r, col] of [[30, '#ff8a3a'], [90, '#ff6a2a']]) {
    const sm = mk(Math.ceil(lw / 8), Math.ceil(lh / 8)), sg = sm.getContext('2d');
    sg.filter = `blur(${r * RES / 8}px)`; sg.drawImage(tint(dot, col), 0, 0, sm.width, sm.height);
    dgg.drawImage(sm, 0, 0, lw, lh);
  }
  L.dotGlow = dGlow;
}

// Coconut palms, drawn procedurally: a curved trunk and a crown of feathery fronds.
function drawPalm(g, bx, by, h, lean, scale, seed) {
  const rnd = mulberry32(seed);
  const tx = bx + lean * h, ty = by - h;                     // crown position
  const cx = bx + lean * h * 0.15, cy = by - h * 0.55;       // trunk bend
  // trunk: tapered band along a quadratic curve
  const N = 30, w0 = 16 * scale, w1 = 7 * scale, L = [], Rr = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
    const px = a * bx + b * cx + c * tx, py = a * by + b * cy + c * ty;
    const dx = 2 * (1 - u) * (cx - bx) + 2 * u * (tx - cx), dy = 2 * (1 - u) * (cy - by) + 2 * u * (ty - cy);
    const len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len, w = (w0 + (w1 - w0) * u) / 2;
    L.push([px + nx * w, py + ny * w]); Rr.push([px - nx * w, py - ny * w]);
  }
  g.beginPath(); g.moveTo(...L[0]); L.forEach(p => g.lineTo(...p)); Rr.reverse().forEach(p => g.lineTo(...p)); g.closePath(); g.fill();
  // fronds
  const n = 9;
  for (let k = 0; k < n; k++) {
    const ang = -Math.PI / 2 + (k / (n - 1) - 0.5) * Math.PI * 1.55 + (rnd() - 0.5) * 0.25;
    const len = (110 + rnd() * 60) * scale;
    const ex = tx + Math.cos(ang) * len, ey = ty + Math.sin(ang) * len * 0.55 + len * 0.45; // tips droop
    const qx = tx + Math.cos(ang) * len * 0.55, qy = ty + Math.sin(ang) * len * 0.75 - 18 * scale;
    // rib
    g.lineWidth = 4 * scale; g.lineCap = 'round';
    g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(qx, qy, ex, ey); g.stroke();
    // leaflets hanging off both sides of the rib
    for (let i = 2; i <= 22; i++) {
      const u = i / 23, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
      const px = a * tx + b * qx + c * ex, py = a * ty + b * qy + c * ey;
      const dx = 2 * (1 - u) * (qx - tx) + 2 * u * (ex - qx), dy = 2 * (1 - u) * (qy - ty) + 2 * u * (ey - qy);
      const ra = Math.atan2(dy, dx), ll = (34 - 26 * u) * scale * (0.8 + rnd() * 0.4);
      g.lineWidth = (5 - 3 * u) * scale;
      for (const side of [-1, 1]) {
        const la = ra + side * 0.9 + 0.35;          // leaflets angle back and hang down
        g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(la) * ll, py + Math.sin(la) * ll + ll * 0.35); g.stroke();
      }
    }
  }
  // coconuts
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(tx + (i - 1) * 9 * scale, ty + 10 * scale, 6 * scale, 0, 7); g.fill(); }
}

function drawPalms(g, pad, lw0, lh0) {
  const S = lw0 / 860 * 0.62;           // size relative to the logo
  g.save();
  g.globalCompositeOperation = 'source-atop';
  const base = pad + lh0 * 1.08;
  const trees = [ // x (fraction of logo width), height (fraction of logo height), lean, size, seed
    [0.06, 0.62, 0.30, 0.95, 11], [0.27, 0.78, -0.20, 1.05, 23], [0.45, 0.55, 0.22, 0.80, 37],
    [0.63, 0.80, -0.26, 1.10, 41], [0.84, 0.66, 0.22, 0.95, 59], [0.97, 0.50, -0.18, 0.75, 67]];
  // back layer: faint, then front layer a little stronger
  for (const [layer, col] of [[0, 'rgba(70,20,140,0.28)'], [1, 'rgba(55,12,115,0.45)']]) {
    g.fillStyle = g.strokeStyle = col;
    trees.forEach(([fx, fh, lean, sz, seed], i) => {
      if (i % 2 !== layer) return;
      drawPalm(g, pad + lw0 * fx, base, lh0 * fh, lean, S * sz * (layer ? 1 : 0.9), seed);
    });
  }
  g.restore();
}

function buildGrain() {
  const rnd = mulberry32(1337);
  for (let k = 0; k < 8; k++) {
    const c = mk(360, 640), g = c.getContext('2d'), img = g.createImageData(360, 640);
    for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0); grain.push(c);
  }
}

// ---------- scene ----------
function frame(t, fi) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // camera: starts very close, pulls back fast-then-slow, keeps drifting a touch
  const e = easeOutQuint(prog(t, 0, 5.0));
  const S0 = 3.2;
  const s = (S0 + (1 - S0) * e) * (1 - 0.03 * easeInOut(prog(t, 5.0, DURATION)));
  // start framed on the X, end centred
  const fx = 0.33 + (0.5 - 0.33) * easeOutCubic(prog(t, 0, 5.0));
  const dw = L.w * s, dh = L.h * s;
  const x = W / 2 - dw * fx, y = H / 2 - dh / 2;

  // light comes up from nothing, with a slight flicker as it catches
  const up = easeInOut(prog(t, 0.25, 2.6));
  const flick = 1 - 0.18 * Math.exp(-Math.pow((t - 1.1) / 0.12, 2)) - 0.12 * Math.exp(-Math.pow((t - 1.5) / 0.08, 2));
  const breathe = 1 + 0.05 * Math.sin(t * 2.1);
  const fp = prog(t, 2.7, 3.9);                       // fill progress
  const I = up * flick * breathe * (1 - 0.3 * easeInOut(fp));

  // faint warm haze behind the logo
  const hz = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900);
  hz.addColorStop(0, `rgba(120,40,110,${0.22 * up})`); hz.addColorStop(0.5, `rgba(70,20,60,${0.10 * up})`); hz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  // light rays: the wide glow smeared outward from the centre (cheap radial blur)
  for (let k = 1; k <= 7; k++) {
    const z = 1 + k * 0.035;
    ctx.globalAlpha = I * 0.10 * (1 - k / 8);
    ctx.drawImage(L.rimWide, W / 2 - dw * z / 2 + (0.5 - fx) * dw, y - dh * (z - 1) / 2, dw * z, dh * z);
  }

  // rim light layers, wide to tight
  ctx.globalAlpha = I * 0.55; ctx.drawImage(L.rimHuge, x, y, dw, dh);
  ctx.globalAlpha = I * 0.85; ctx.drawImage(L.rimWide, x, y, dw, dh);
  ctx.globalAlpha = I * 1.00; ctx.drawImage(L.rimMid, x, y, dw, dh);
  ctx.globalAlpha = I * 1.00; ctx.drawImage(L.rimTight, x, y, dw, dh);
  ctx.globalAlpha = clamp(I) * 0.9; ctx.drawImage(L.edge, x, y, dw, dh);

  // black body on top
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1; ctx.drawImage(L.body, x, y, dw, dh);

  // the logo fills itself from the bottom up, then the inner border lights
  if (fp > 0) {
    const top = y + L.pad * s, bot = y + (L.pad + L.lh0) * s, soft = 120;
    const yw = bot + soft - (bot - top + soft * 2) * easeInOut(fp);
    const og = off.getContext('2d');
    og.globalCompositeOperation = 'source-over'; og.globalAlpha = 1; og.clearRect(0, 0, W, H);
    og.drawImage(L.fill, x, y, dw, dh);
    og.globalCompositeOperation = 'destination-in';
    const wg = og.createLinearGradient(0, yw - soft, 0, yw + soft);
    wg.addColorStop(0, 'rgba(0,0,0,0)'); wg.addColorStop(1, 'rgba(0,0,0,1)');
    og.fillStyle = wg; og.fillRect(0, 0, W, H);
    ctx.drawImage(off, 0, 0);
    // bright leading edge of the fill
    const flash = Math.sin(Math.PI * clamp(fp));
    if (flash > 0.01) {
      og.globalCompositeOperation = 'source-over'; og.clearRect(0, 0, W, H);
      og.drawImage(L.fill, x, y, dw, dh);
      og.globalCompositeOperation = 'destination-in';
      const lg = og.createLinearGradient(0, yw - 40, 0, yw + 40);
      lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(0.5, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
      og.fillStyle = lg; og.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.8 * flash; ctx.drawImage(off, 0, 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = easeInOut(prog(t, 3.3, 4.1)); ctx.drawImage(L.stroke, x, y, dw, dh);
    ctx.globalAlpha = 1;
  }

  // the orange dot ignites
  const dp = prog(t, 4.1, 4.7);
  if (dp > 0) {
    const pop = easeOutCubic(dp) * (1 + 0.35 * Math.exp(-Math.pow((t - 4.35) / 0.12, 2)));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55 * pop; ctx.drawImage(L.dotGlow, x, y, dw, dh);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = clamp(pop); ctx.drawImage(L.dot, x, y, dw, dh);
  }

  // vignette, grain, fade in from black
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.025;
  ctx.drawImage(grain[fi % grain.length], 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

window.renderFrame = (t, fi = Math.round(t * 24)) => frame(t, fi);

window.ready = loadImg(LOGO_SRC).then(img => {
  build(img); buildGrain();
  window.DURATION = DURATION;
  if (!window.__RENDERING__) {   // live preview when opened in a browser
    const start = performance.now();
    const loop = now => { const t = ((now - start) / 1000) % (DURATION + 1); renderFrame(Math.min(t, DURATION)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  return true;
});
</script>
</body>
</html>
