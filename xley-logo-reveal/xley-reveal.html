<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Xley Logo Reveal</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; }
  canvas { display: block; height: 100vh; margin: 0 auto; }
</style>
<script src="logo_paths.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Xley logo reveal, vertical 9:16 motion graphic.
   The logo is traced into vector pieces (X, L, E, Y, ring, dot) and built up:
   black -> glowing outlines draw each letter in turn -> letters fill with a
   sunset gradient one after another with a small pop -> the dot pops in with a
   shockwave -> a light sweep crosses the logo, which then holds.
   Key moments land on the song's downbeats (126 bpm) after the brand clip.
   Deterministic: renderFrame(t) draws the frame at time t (seconds). */
const W = 1080, H = 1920;
const DURATION = 7.5;
const BEAT = 60 / 126;
const T_DRAW = 0.915;                 // downbeat 1: outlines start drawing
const T_FILL = T_DRAW + 4 * BEAT;     // downbeat 2: letters fill
const T_DOT = T_FILL + 4 * BEAT;      // downbeat 3: dot pops
const T_SHINE = T_DOT + 1.5 * BEAT;   // light sweep
const LOGO_W = 860;                   // on-screen width

const P = window.LOGO_PATHS;
const K = LOGO_W / P.w;               // logo px -> screen px
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutElastic = x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -9 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;

// ---------- pieces ----------
function polyPath(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; }
function polyLen(pts) { let L = 0; for (let i = 0; i < pts.length; i++) { const [a, b] = pts[i], [c, d] = pts[(i + 1) % pts.length]; L += Math.hypot(c - a, d - b); } return L; }
function pointAt(pts, f) { // point at fraction f along the closed outline
  let target = f * polyLen(pts);
  for (let i = 0; i < pts.length; i++) {
    const [a, b] = pts[i], [c, d] = pts[(i + 1) % pts.length], l = Math.hypot(c - a, d - b);
    if (target <= l) return [a + (c - a) * target / l, b + (d - b) * target / l];
    target -= l;
  }
  return pts[0];
}
const piece = name => P.pieces.find(p => p.name === name);
// draw order and stagger: X with its ring first, then L, E, Y
const ORDER = [['X', 0], ['ring', 0.12], ['L', 0.30], ['E', 0.55], ['Y', 0.80]];
const PIECES = ORDER.map(([name, delay]) => {
  const p = piece(name), pts = p.paths[0];
  // start each outline at its lowest-left point so the line travels up and round
  let s = 0; pts.forEach(([x, y], i) => { if (y - x * 0.3 > pts[s][1] - pts[s][0] * 0.3) s = i; });
  const rot = pts.slice(s).concat(pts.slice(0, s));
  return { name, delay, pts: rot, path: polyPath(rot), len: polyLen(rot), cx: p.x + p.w / 2, cy: p.y + p.h / 2 };
});
const DOT = { pts: P.dot[0], path: polyPath(P.dot[0]) };
DOT.cx = DOT.pts.reduce((s, p) => s + p[0], 0) / DOT.pts.length;
DOT.cy = DOT.pts.reduce((s, p) => s + p[1], 0) / DOT.pts.length;
DOT.r = Math.max(...DOT.pts.map(([x, y]) => Math.hypot(x - DOT.cx, y - DOT.cy)));
const ALL = new Path2D(); PIECES.forEach(p => ALL.addPath(p.path));

// colours (in logo space)
function fillGrad(c) {
  const g = c.createLinearGradient(P.w * 0.1, -P.h * 0.05, P.w * 0.22, P.h * 1.05);
  g.addColorStop(0.00, '#6c4cff'); g.addColorStop(0.38, '#a43fe6'); g.addColorStop(0.70, '#e260c8'); g.addColorStop(1.00, '#ff9fae');
  return g;
}
function lineGrad(c) {
  const g = c.createLinearGradient(0, 0, P.w, P.h);
  g.addColorStop(0.0, '#ffd27a'); g.addColorStop(0.4, '#ff9a6a'); g.addColorStop(0.75, '#ff5fd0'); g.addColorStop(1.0, '#b46cff');
  return g;
}

// ---------- frame ----------
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // camera: a very slow push in the whole time
  const cam = 0.985 + 0.045 * easeInOut(prog(t, 0, DURATION));
  const sc = K * cam, ox = W / 2 - P.w * sc / 2, oy = H / 2 - P.h * sc / 2;
  const toLogo = () => ctx.setTransform(sc, 0, 0, sc, ox, oy);
  const px = v => v / sc;   // screen px -> logo px (for line widths)

  // soft glow once the logo is filled
  const lit = easeOut(prog(t, T_FILL, T_FILL + 1.2));
  if (lit > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 620);
    g.addColorStop(0, `rgba(150,60,200,${0.16 * lit})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  for (const p of PIECES) {
    const t0 = T_DRAW + p.delay, drawP = easeInOut(prog(t, t0, t0 + 1.25));
    const f0 = T_FILL + p.delay * 0.35, fillP = prog(t, f0, f0 + 0.42);
    if (drawP <= 0) continue;

    // pop: each piece kicks a little bigger as it fills, then settles
    const pop = fillP > 0 ? 1 + 0.07 * Math.sin(Math.PI * clamp(fillP * 1.4)) * (1 - fillP * 0.3) : 1;
    toLogo();
    ctx.translate(p.cx, p.cy); ctx.scale(pop, pop); ctx.translate(-p.cx, -p.cy);

    // 1. the fill, wiping up from the bottom of each piece
    if (fillP > 0) {
      const e = easeOut(fillP);
      ctx.save(); ctx.clip(p.path);
      ctx.fillStyle = fillGrad(ctx); ctx.fill(p.path);
      // still-unfilled top part stays dark, with a bright leading edge
      const yTop = (P.h + 40) - (P.h + 80) * e;
      ctx.fillStyle = '#000'; ctx.fillRect(-50, -50, P.w + 100, yTop + 50);
      if (fillP < 1) {
        const lg = ctx.createLinearGradient(0, yTop - 30, 0, yTop + 50);
        lg.addColorStop(0, 'rgba(255,240,255,0)'); lg.addColorStop(0.45, `rgba(255,235,250,${0.9 * (1 - fillP)})`); lg.addColorStop(1, 'rgba(255,240,255,0)');
        ctx.fillStyle = lg; ctx.fillRect(-50, yTop - 30, P.w + 100, 80);
      }
      // inner purple band along the edge (the stroke is clipped, so only its inner half shows)
      ctx.globalAlpha = easeOut(prog(t, f0 + 0.2, f0 + 0.7));
      ctx.lineJoin = 'round'; ctx.lineWidth = px(11); ctx.strokeStyle = 'rgba(80,30,190,0.85)'; ctx.stroke(p.path);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // 2. the outline drawing itself on, with a glow and a spark at its tip
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.setLineDash([p.len * drawP, p.len * 2]);
    const glowA = fillP > 0 ? 1 - 0.65 * easeOut(fillP) : 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = 'rgba(255,90,200,0.9)'; ctx.shadowBlur = 26 * glowA;
    ctx.strokeStyle = lineGrad(ctx); ctx.lineWidth = px(7); ctx.globalAlpha = 0.55 * glowA; ctx.stroke(p.path);
    ctx.restore();
    ctx.strokeStyle = lineGrad(ctx); ctx.lineWidth = px(3.2); ctx.stroke(p.path);
    ctx.setLineDash([]);

    if (drawP < 1) {
      const [hx, hy] = pointAt(p.pts, drawP);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const sx = ox + hx * sc, sy = oy + hy * sc;
      const sp = ctx.createRadialGradient(sx, sy, 0, sx, sy, 34);
      sp.addColorStop(0, 'rgba(255,255,255,1)'); sp.addColorStop(0.25, 'rgba(255,200,240,0.8)'); sp.addColorStop(1, 'rgba(255,80,200,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = sp; ctx.fillRect(sx - 34, sy - 34, 68, 68);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // 3. the orange dot pops in with a shockwave
  const dp = prog(t, T_DOT, T_DOT + 0.7);
  if (dp > 0) {
    toLogo();
    const s = easeOutElastic(dp);
    ctx.save();
    ctx.translate(DOT.cx, DOT.cy); ctx.scale(s, s); ctx.translate(-DOT.cx, -DOT.cy);
    const g = ctx.createRadialGradient(DOT.cx - DOT.r * 0.3, DOT.cy - DOT.r * 0.3, 0, DOT.cx, DOT.cy, DOT.r);
    g.addColorStop(0, '#ffb066'); g.addColorStop(1, '#e8853a');
    ctx.fillStyle = g; ctx.fill(DOT.path);   // crisp brand-orange dot
    ctx.restore();
    // shockwave rings
    for (const [delay, maxR, w] of [[0, 7, 6], [0.08, 11, 3]]) {
      const q = prog(t, T_DOT + delay, T_DOT + delay + 0.65);
      if (q <= 0 || q >= 1) continue;
      ctx.beginPath(); ctx.arc(DOT.cx, DOT.cy, DOT.r * (1 + maxR * easeOut(q)), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,170,90,${0.8 * (1 - q)})`; ctx.lineWidth = px(w * (1 - q) + 0.5); ctx.stroke();
    }
  }

  // 4. light sweep across the finished logo
  const sw = prog(t, T_SHINE, T_SHINE + 0.9);
  if (sw > 0 && sw < 1) {
    toLogo(); ctx.save(); ctx.clip(ALL);
    const x = -P.w * 0.3 + P.w * 1.6 * easeInOut(sw);
    const g = ctx.createLinearGradient(x - 160, 0, x + 160, P.h * 0.35);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,250,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(-100, -100, P.w + 200, P.h + 200);
    ctx.restore();
  }
}

window.renderFrame = t => frame(t);
window.DURATION = DURATION;
window.ready = Promise.resolve(true);
if (!window.__RENDERING__) {   // live preview when opened in a browser
  const start = performance.now();
  const loop = now => { const t = ((now - start) / 1000) % (DURATION + 1); frame(Math.min(t, DURATION)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
