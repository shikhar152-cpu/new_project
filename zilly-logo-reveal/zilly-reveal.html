<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zilly Logo Reveal</title>
<style>
  html, body { margin: 0; background: #07030d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Zilly logo reveal: a sunset-gradient wordmark that starts huge, then eases
   out (fast, then slower and slower) into place, followed by a light sweep.
   Deterministic: renderFrame(t) draws the frame at time t (seconds). */
const W = 1920, H = 1080;
const DURATION = 7;            // seconds
const TEXT = 'ZILLY';
const FONT = '900 330px "Inter Display Black", "Inter Display", "Inter", sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- prebuilt layers ----------
let logo, logoGlow, grain = [];

function buildLogo() {
  const pad = 120;
  const m = document.createElement('canvas').getContext('2d');
  m.font = FONT;
  m.letterSpacing = '-8px';
  const tw = Math.ceil(m.measureText(TEXT).width);
  const th = 330;
  const lw = tw + pad * 2, lh = th + pad * 2;

  // Fill: sunset gradient, warm top to cool bottom
  const fill = document.createElement('canvas'); fill.width = lw; fill.height = lh;
  const f = fill.getContext('2d');
  f.font = FONT; f.letterSpacing = '-8px'; f.textAlign = 'center'; f.textBaseline = 'middle';
  const cx = lw / 2, cy = lh / 2 + 8;
  const top = cy - th * 0.38, bot = cy + th * 0.38;
  const g = f.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0.00, '#fff2a8');
  g.addColorStop(0.18, '#ffc45a');
  g.addColorStop(0.38, '#ff7a3c');
  g.addColorStop(0.58, '#ff3d86');
  g.addColorStop(0.78, '#c43cff');
  g.addColorStop(1.00, '#4a5cff');

  // dark outer edge for depth
  f.lineJoin = 'round';
  f.lineWidth = 14; f.strokeStyle = '#1a0628';
  f.strokeText(TEXT, cx, cy + 6);
  f.fillStyle = g; f.fillText(TEXT, cx, cy);

  // a hint of horizontal gradient, pink on the left and cyan on the right
  f.globalCompositeOperation = 'source-atop';
  const hg = f.createLinearGradient(cx - tw / 2, 0, cx + tw / 2, 0);
  hg.addColorStop(0, 'rgba(255,60,150,0.25)');
  hg.addColorStop(0.5, 'rgba(255,255,255,0)');
  hg.addColorStop(1, 'rgba(60,220,255,0.22)');
  f.fillStyle = hg; f.fillRect(0, 0, lw, lh);

  // glossy highlight along the top half
  const sh = f.createLinearGradient(0, top - 20, 0, cy);
  sh.addColorStop(0, 'rgba(255,255,255,0.55)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  f.fillStyle = sh; f.fillRect(0, 0, lw, cy - 10);
  f.globalCompositeOperation = 'source-over';

  // thin bright inner rim
  f.lineWidth = 2.5; f.strokeStyle = 'rgba(255,240,220,0.7)';
  f.strokeText(TEXT, cx, cy);

  logo = { c: fill, w: lw, h: lh, tw, th };

  // Glow: blurred, saturated copy for bloom
  const gl = document.createElement('canvas'); gl.width = lw; gl.height = lh;
  const gg = gl.getContext('2d');
  gg.filter = 'blur(28px) saturate(1.6)';
  gg.drawImage(fill, 0, 0);
  gg.filter = 'blur(70px) saturate(1.8)';
  gg.globalAlpha = 0.9;
  gg.drawImage(fill, 0, 0);
  logoGlow = gl;
}

function buildGrain() {
  const rnd = mulberry32(1337);
  for (let k = 0; k < 8; k++) {
    const c = document.createElement('canvas'); c.width = 480; c.height = 270;
    const g = c.getContext('2d');
    const img = g.createImageData(480, 270);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = rnd() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    grain.push(c);
  }
}

// ---------- scene ----------
function background(t, settle) {
  // deep night-purple base
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b0418');
  bg.addColorStop(0.55, '#140726');
  bg.addColorStop(1, '#05020a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // sunset haze behind the logo, growing as it lands
  const r = 520 + 260 * settle;
  const rg = ctx.createRadialGradient(W / 2, H / 2 + 40, 0, W / 2, H / 2 + 40, r * 1.6);
  rg.addColorStop(0, `rgba(255,90,140,${0.30 * settle + 0.05})`);
  rg.addColorStop(0.35, `rgba(190,50,220,${0.20 * settle + 0.03})`);
  rg.addColorStop(1, 'rgba(10,4,24,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // slow-drifting horizon light bands
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const y = H * (0.62 + i * 0.07) + Math.sin(t * 0.6 + i) * 6;
    const band = ctx.createLinearGradient(0, y - 30, 0, y + 30);
    const col = ['255,120,80', '255,60,150', '120,80,255'][i];
    band.addColorStop(0, `rgba(${col},0)`);
    band.addColorStop(0.5, `rgba(${col},${0.05 * settle})`);
    band.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = band; ctx.fillRect(0, y - 30, W, 60);
  }
  ctx.restore();
}

function drawLogo(t) {
  // Zoom: starts ~7x, slows with expo ease-out, then keeps drifting slightly
  const zoomP = prog(t, 0, 3.4);
  const e = easeOutExpo(zoomP);
  const S0 = 7.0;
  let s = S0 + (1 - S0) * e;
  s *= 1 - 0.035 * easeInOut(prog(t, 3.4, DURATION)); // slow push-out after landing

  const alpha = clamp(prog(t, 0, 0.5));
  const settle = easeInOut(prog(t, 1.2, 3.6));

  // blur while it moves fast, sharp once settled
  const speed = (1 - e);
  const blur = 10 * speed * speed;

  const dw = logo.w * s, dh = logo.h * s;
  const x = W / 2 - dw / 2, y = H / 2 - dh / 2;

  // bloom behind the letters
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const pulse = 0.85 + 0.15 * Math.sin(t * 2.2);
  ctx.globalAlpha = alpha * (0.35 + 0.55 * settle) * pulse;
  ctx.drawImage(logoGlow, x, y, dw, dh);
  ctx.restore();

  // letters
  ctx.save();
  ctx.globalAlpha = alpha;
  if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(2)}px)`;
  ctx.drawImage(logo.c, x, y, dw, dh);
  ctx.restore();

  // light sweep once it has landed
  const sw = prog(t, 3.5, 4.7);
  if (sw > 0 && sw < 1) {
    const tmp = document.createElement('canvas'); tmp.width = logo.w; tmp.height = logo.h;
    const g = tmp.getContext('2d');
    g.drawImage(logo.c, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    const sx = -300 + (logo.w + 600) * easeInOut(sw);
    const lg = g.createLinearGradient(sx - 140, 0, sx + 140, logo.h * 0.25);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.85)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg; g.fillRect(0, 0, logo.w, logo.h);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(logo.c, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.75 * Math.sin(Math.PI * sw);
    ctx.drawImage(tmp, x, y, dw, dh);
    ctx.restore();
  }

  // anamorphic lens streak as it lands
  const fl = Math.exp(-Math.pow((t - 3.0) / 0.9, 2));
  if (fl > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fy = H / 2 - dh * 0.12;
    const streak = ctx.createLinearGradient(0, 0, W, 0);
    streak.addColorStop(0, 'rgba(255,80,170,0)');
    streak.addColorStop(0.5, `rgba(255,200,230,${0.45 * fl})`);
    streak.addColorStop(1, 'rgba(120,120,255,0)');
    ctx.fillStyle = streak;
    ctx.filter = 'blur(6px)';
    ctx.fillRect(0, fy - 3, W, 6);
    ctx.restore();
  }

  return settle;
}

function post(t, frameIndex) {
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  // film grain
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.10;
  ctx.drawImage(grain[frameIndex % grain.length], 0, 0, W, H);
  ctx.restore();

  // fade in from black
  const fin = 1 - clamp(prog(t, 0, 0.35));
  if (fin > 0) { ctx.fillStyle = `rgba(0,0,0,${fin})`; ctx.fillRect(0, 0, W, H); }
}

window.renderFrame = (t, frameIndex = Math.round(t * 30)) => {
  ctx.clearRect(0, 0, W, H);
  const settle = easeInOut(prog(t, 1.2, 3.6));
  background(t, settle);
  drawLogo(t);
  post(t, frameIndex);
};

window.ready = document.fonts.load(FONT).then(() => {
  buildLogo(); buildGrain();
  window.DURATION = DURATION;
  // live preview when opened in a browser
  if (!window.__RENDERING__) {
    const start = performance.now();
    const loop = now => { const t = ((now - start) / 1000) % (DURATION + 1); renderFrame(Math.min(t, DURATION)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  return true;
});
</script>
</body>
</html>
